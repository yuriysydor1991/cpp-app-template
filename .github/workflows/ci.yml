# GitHub Actions pipeline analogous to misc/Jenkinsfile.
#
# It mirrors the Jenkins stages on an Ubuntu runner: a clang-format check, a
# Debug build with sanitizers running the unit and component tests (with an
# optional cppcheck pass), a clang-tidy build, and a Release build + install.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_cppcheck:
        description: 'Run the cppcheck static code check?'
        type: boolean
        default: false

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDDIR: build
  BDJUNITOUT: junit-out
  # The development packages of the branch specific libraries.
  DEPENDENCIES: libsqlitecpp-dev

jobs:
  code-format:
    name: Code format (clang-format)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++ clang-format $DEPENDENCIES
      - name: Code format configure
        run: scripts/pipelines/code-format-configure.sh
      - name: Code format build (clang-format)
        run: scripts/pipelines/code-format-build.sh

  build-and-test:
    name: Debug build & tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++ cppcheck libgtest-dev libgmock-dev $DEPENDENCIES
      - name: Debug configure
        run: scripts/pipelines/debug-configure.sh
      - name: Debug build
        run: scripts/pipelines/build.sh
      - name: cppcheck
        if: ${{ inputs.run_cppcheck }}
        run: scripts/pipelines/build.sh cppcheck
      - name: Unit Tests
        run: scripts/pipelines/test.sh UTEST UTEST_
      - name: Component Tests
        run: scripts/pipelines/test.sh CTEST CTEST_
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: ${{ env.BUILDDIR }}/${{ env.BDJUNITOUT }}/*.xml
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++ clang-tidy $DEPENDENCIES
      - name: Debug configure (clang-tidy)
        run: scripts/pipelines/clang-tidy-configure.sh
      - name: Debug build (clang-tidy runs during compilation)
        run: scripts/pipelines/build.sh

  release:
    name: Release build & install
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++ $DEPENDENCIES
      - name: Release configure
        run: scripts/pipelines/release-configure.sh
      - name: Release build
        run: scripts/pipelines/build.sh
      - name: Release install
        run: scripts/pipelines/install.sh
